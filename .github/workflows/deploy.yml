name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and commit hash
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "COMMIT_HASH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            COMMIT_HASH=${{ env.COMMIT_HASH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Sync runtime environment variables to Coolify
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          RESOURCE_UUID: ${{ vars.RESOURCE_UUID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          jq -n --arg token "${BOT_TOKEN}" \
            '{data: [{key: "BOT_TOKEN", value: $token, is_runtime: true, is_buildtime: false}]}' |
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: Bearer ${DEPLOY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @- \
            "${DEPLOY_HOST}/api/v1/applications/${RESOURCE_UUID}/envs/bulk"

      - name: Trigger Coolify deployment
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          RESOURCE_UUID: ${{ vars.RESOURCE_UUID }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${DEPLOY_TOKEN}" \
            "${DEPLOY_HOST}/api/v1/deploy?uuid=${RESOURCE_UUID}&force=false"
